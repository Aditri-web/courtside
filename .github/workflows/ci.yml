name: CourtSide CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Modern Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Get Yarn cache path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test AI Service (Unit & Schema Tests)
        run: yarn test:service

      - name: Typecheck Shared UI
        run: yarn workspace @multi-tv/shared-ui typecheck

      - name: Test Multi-TV App
        run: yarn workspace @multi-tv/expo-multi-tv test --watchAll=false
